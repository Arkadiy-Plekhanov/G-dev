name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: selfdev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply migrations
        run: |
          for f in database/01_schema_v2_multitenant_BASE.sql \
                   database/02_security_gate_migration.sql \
                   database/03_google_auth_migration.sql \
                   database/04_seed_reference_data.sql \
                   database/05_catalog_ideals_schema.sql; do
            psql "postgresql://postgres:postgres@127.0.0.1:5432/selfdev" -v ON_ERROR_STOP=1 -f "$f"
          done
          pip install psycopg2-binary --break-system-packages
          SEED_DSN="host=127.0.0.1 dbname=selfdev user=postgres password=postgres" \
            python3 database/06_seed_catalog_and_ideals.py
          for f in database/08_migrate_and_cutover.sql database/09_remove_is_relevant.sql; do
            psql "postgresql://postgres:postgres@127.0.0.1:5432/selfdev" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt --break-system-packages
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app_writer:change_me_in_production@127.0.0.1:5432/selfdev
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      # Frontend vitest integration tests need a live backend (see frontend/README.md) --
      # deliberately not run here yet; add a backend service + migrations to this job
      # (mirroring the `backend` job above) before enabling `npx vitest run` in CI.
