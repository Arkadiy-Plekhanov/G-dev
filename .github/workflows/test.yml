name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: selfdev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration deps
        run: pip install psycopg2-binary --break-system-packages
      - name: Apply migrations
        # scripts/apply-migrations.sh -- единственный источник правды о списке
        # миграций, используется здесь и в Makefile/scripts/reset-neon.sh.
        # Раньше список был продублирован в трёх местах отдельно; добавление
        # миграции 10 обновило только одно из них, CI остался со старым
        # списком, и всё тихо сломалось до первого реального использования.
        run: DSN="postgresql://postgres:postgres@127.0.0.1:5432/selfdev" bash scripts/apply-migrations.sh
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt --break-system-packages
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app_writer:change_me_in_production@127.0.0.1:5432/selfdev
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      # Frontend vitest integration tests need a live backend (see frontend/README.md) --
      # deliberately not run here yet; add a backend service + migrations to this job
      # (mirroring the `backend` job above) before enabling `npx vitest run` in CI.
