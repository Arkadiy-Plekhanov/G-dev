services:
  - type: web
    name: qualities-api-staging
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # DATABASE_URL, GOOGLE_CLIENT_ID -- вписать вручную в Render dashboard
      # после первого деплоя (sync: false = "спроси меня", не хранить в git).
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # CORS_ORIGINS -- JSON-массив строкой (подтверждено вживую, что
      # pydantic-settings так и парсит list[str] из окружения). Вписать
      # реальный Cloudflare Pages URL после его создания, например:
      # ["https://qualities-app.pages.dev"]
      - key: CORS_ORIGINS
        sync: false
      # JWT_SECRET -- Render сам сгенерирует случайное безопасное значение,
      # никогда не будет в git.
      - key: JWT_SECRET
        generateValue: true
