[pytest]
# Без этого файла "pytest" (в отличие от "python -m pytest") не гарантирует
# текущую директорию в sys.path -- внутри Docker (WORKDIR=/app) это давало
# ModuleNotFoundError: No module named 'app' на любом "from app.X import Y"
# в тестах, хотя в песочнице разработки это случайно работало (там pytest
# всегда запускался напрямую из backend/ иначе). pythonpath -- официальный
# способ pytest (7.0+) объявить это явно, а не полагаться на способ вызова.
pythonpath = .
